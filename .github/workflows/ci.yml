name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        run: bun test tests/core/utils.test.ts

      - name: Build
        run: bun run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Install Playwright
        run: bunx playwright install chromium --with-deps

      - name: Integration tests
        run: |
          git ls-files 'tests/**/*.test.ts' | while IFS= read -r test_file; do
            bun test "$test_file" --parallel=1 --timeout 60000
          done
