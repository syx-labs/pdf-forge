<style>
  .executive-report {
    display: grid;
    gap: var(--space-8);
    width: 100%;
    min-height: 100%;
    padding: var(--space-8);
    background-color: var(--color-background);
    color: var(--color-text-primary);
  }

  .executive-report__header {
    display: grid;
    gap: var(--space-3);
    max-width: 72ch;
  }

  .executive-report__title {
    margin: 0;
    color: var(--color-text-primary);
    font-family: var(--font-display);
    font-size: calc(var(--font-size-metric) * 1.25);
    font-weight: var(--font-weight-semibold);
    letter-spacing: var(--tracking-heading);
    line-height: var(--line-height-tight);
  }

  .executive-report__summary {
    margin: 0;
    color: var(--color-text-secondary);
    font-family: var(--font-body);
    font-size: var(--font-size-body);
    letter-spacing: var(--tracking-body);
    line-height: var(--line-height-body);
  }

  .executive-report__metrics {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-4);
  }

  .executive-report__table {
    min-width: 0;
  }

  .executive-report__recommendations-section {
    display: grid;
    gap: var(--space-4);
  }

  .executive-report__recommendations-heading {
    margin: 0;
    color: var(--color-text-primary);
    font-family: var(--font-display);
    font-size: var(--font-size-body);
    font-weight: var(--font-weight-semibold);
    letter-spacing: var(--tracking-heading);
    line-height: var(--line-height-body);
  }

  .executive-report__recommendations {
    display: grid;
    gap: var(--space-3);
    margin: 0;
    padding-left: var(--space-6);
    color: var(--color-text-secondary);
    font-family: var(--font-body);
    font-size: var(--font-size-body);
    letter-spacing: var(--tracking-body);
    line-height: var(--line-height-body);
  }
</style>

<article class="executive-report">
  <header class="executive-report__header">
    <h1 class="executive-report__title" data-pdf-forge-slot="title">{{escape:title}}</h1>
    <p class="executive-report__summary" data-pdf-forge-slot="summary">{{escape:summary}}</p>
  </header>
  <div class="executive-report__metrics" data-pdf-forge-slot="metrics"></div>
  <div class="executive-report__table" data-pdf-forge-slot="table"></div>
  <section class="executive-report__recommendations-section">
    <h2 class="executive-report__recommendations-heading">Recommendations</h2>
    <ul class="executive-report__recommendations" data-pdf-forge-slot="recommendations">
      <li class="executive-report__recommendation" data-pdf-forge-each="recommendations">{{escape:recommendations[]}}</li>
    </ul>
  </section>
</article>
